function caught(why){if(state!=="play")return;state="caught";sfx("bad");ov.innerHTML=`<div class="card"><h1 class="bad">CAPTURADO</h1><p>${why}</p><p class="k">Nivel ${level} · ${th.n}</p><button data-go>REINTENTAR</button></div>`;ov.classList.add("on");}function complete(){const bonus=500+Math.floor(timeLeft)*5;score+=bonus;state="clear";sfx("win");const next=level<10;ov.innerHTML=`<div class="card"><h1>NIVEL ${level} SUPERADO</h1><p>Blancas ${white}/3 · Oro ${gold}/6<br>Bonificación +${bonus} pts</p><p class="k">Puntuación total: ${score}</p><button data-go>${next?"SIGUIENTE NIVEL":"VER FINAL"}</button></div>`;ov.classList.add("on");}function showWin(){state="win";ov.innerHTML=`<div class="card"><h1>ESCAPE PERFECTO</h1><div class="sub">GLITCHLAND CLEAR</div><p>Has salido de los 10 laberintos.<br>Puntuación final: <b>${score}</b> pts</p><p class="k">Midnight Heist: Pixeland Arcade</p><button data-go>JUGAR DE NUEVO</button></div>`;ov.classList.add("on");}function showTitle(){ov.innerHTML=`<div class="card"><h1>MIDNIGHT HEIST</h1><div class="sub">PIXELAND ARCADE</div><p>Roba las <b>3 gallinas blancas</b>, consigue la llave y escapa.<br>Las <b>6 gallinas de oro</b> hacen brillar la salida a través de la oscuridad.</p><p class="k">WASD / Flechas · mover<br>E · esconderse / abrir cajas sorpresa<br>R · reiniciar nivel</p><button data-go>JUGAR</button><small>10 niveles · 300 s por nivel</small></div>`;ov.classList.add("on");}function advance(){if(state==="title")startGame();else if(state==="clear"){if(level<10){level++;variant=0;buildLevel(level);state="play";ov.classList.remove("on");}else showWin();}else if(state==="caught"){variant++;buildLevel(level);state="play";ov.classList.remove("on");}else if(state==="win")startGame();}function startGame(){score=0;level=1;variant=0;buildLevel(1);state="play";ov.classList.remove("on");}function update(dt){if(state!=="play")return;timeLeft-=dt;if(timeLeft<=0){timeLeft=0;caught("El tiempo se agotó");return;}for(const k in effects)effects[k]=Math.max(0,effects[k]-dt);let mx=0,my=0;if(keys.ArrowLeft||keys.KeyA)mx--;if(keys.ArrowRight||keys.KeyD)mx++;if(keys.ArrowUp||keys.KeyW)my--;if(keys.ArrowDown||keys.KeyS)my++;if(effects.invert>0){mx=-mx;my=-my;}const len=Math.hypot(mx,my);if(!player.hidden&&len>0){mx/=len;my/=len;player.moving=true;player.a=Math.atan2(my,mx);player.walk+=dt*11;const sp=118*(effects.boost>0?2:1);const nx=player.x+mx*sp*dt;if(!solid(nx,player.y,7))player.x=nx;const ny=player.y+my*sp*dt;if(!solid(player.x,ny,7))player.y=ny;}else player.moving=false;player.x=clamp(player.x,10,DW-10);player.y=clamp(player.y,10,DH-10);for(const g of guards){g.q=Math.max(0,g.q-dt);updGuard(g,dt);if(state!=="play")return;}for(const c of chickens){if(c.taken||player.hidden||D(player,c)>=15)continue;c.taken=true;if(c.gold){gold++;score+=400;sfx("gold");msg("Gallina de oro "+gold+"/6",1.6);if(gold===6){allGold=true;sfx("win");msg("¡6 GALLINAS DE ORO! La salida brilla en la oscuridad",3.2);}}else{white++;score+=150;sfx("pick");msg("Gallina blanca "+white+"/3",1.6);if(white===3)spawnKey();}}if(key&&!player.hidden&&D(player,key)<16){key=null;haveKey=true;score+=300;sfx("key");msg("¡Llave obtenida! Encuentra la puerta",2.6);}if(haveKey&&D(player,door)<18){complete();return;}if(msgT>0){msgT-=dt;if(msgT<=0)msgEl.classList.remove("on");}updatePrompt();}function updatePrompt(){if(state!=="play"){prEl.textContent="";return;}if(player.hidden){prEl.textContent="E · salir del escondite";return;}let best="",bd=32;for(const h of hides){const d=D(player,h);if(d<bd){bd=d;best="E · esconderse en "+th.hs;}}for(const b of boxes){if(b.used)continue;const d=D(player,b);if(d<bd){bd=d;best="E · abrir caja sorpresa";}}if(!best&&haveKey&&D(player,door)<55)best="La puerta de salida está cerca";prEl.textContent=best;}function updateHUD(){h1.textContent="NIVEL "+level+" · "+th.n;h2.textContent=fmt(timeLeft);h2.style.color=timeLeft<30?"#ff4d6d":"";h3.textContent="BLANCAS "+white+"/3";h4.textContent="ORO "+gold+"/6";h5.textContent=haveKey?"LLAVE OK":(key?"LLAVE A LA VISTA":"LLAVE --");h5.style.color=haveKey||key?"#ffd23f":"";h6.textContent="PTS "+score;const ef=[];if(effects.boost>0)ef.push("VEL x2 "+Math.ceil(effects.boost)+"s");if(effects.invis>0)ef.push("INVIS "+Math.ceil(effects.invis)+"s");if(effects.freeze>0)ef.push("FREEZE "+Math.ceil(effects.freeze)+"s");if(effects.invert>0)ef.push("INVERSO "+Math.ceil(effects.invert)+"s");if(effects.blackout>0)ef.push("OSCURO "+Math.ceil(effects.blackout)+"s");hintEl.textContent="WASD / Flechas · E interactuar · R reiniciar nivel"+(ef.length?" · "+ef.join(" · "):"");}function draw(){if(!G)return;ctx.clearRect(0,0,DW,DH);ctx.drawImage(bg,0,0);drawDoor();for(const h of hides)drawHide(h);for(const b of boxes)drawBox(b);for(const c of chickens)drawChicken(c);if(key)drawKey(key.x,key.y);for(const g of guards)drawGuard(g);drawPlayer();buildDark();ctx.drawImage(dk,0,0);if(allGold)drawGuides();drawBeams();if(level===10){if(elapsed>glitchNext){drawBG();glitchNext=elapsed+.35;}glitch();}}let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;elapsed+=dt;if(state==="play")update(dt);draw();updateHUD();requestAnimationFrame(loop);}addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();keys[e.code]=1;if(e.repeat)return;if(e.code==="Enter"||e.code==="Space")advance();else if(e.code==="KeyE")interact();else if(e.code==="KeyR"&&state==="play"){variant++;buildLevel(level);}});addEventListener("keyup",e=>{keys[e.code]=0;});addEventListener("blur",()=>{for(const k in keys)keys[k]=0;});ov.addEventListener("click",e=>{if(e.target.closest("button"))advance();});
buildLevel(1);state="title";showTitle();requestAnimationFrame(loop);})();</script>
